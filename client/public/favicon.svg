<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
    <!-- Badge background — same deep navy as the app's dark surface token -->
    <circle cx="28" cy="28" r="28" fill="#09111f"/>

    <!-- Two ward signals converging into the letter V, which is also,
         literally, two reports being routed to one resolution point. -->
    <line x1="15" y1="15" x2="28" y2="40" stroke="#22d3ee" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="41" y1="15" x2="28" y2="40" stroke="#22d3ee" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Ward nodes: where each signal originates -->
    <circle cx="15" cy="15" r="3.8" fill="#22d3ee" opacity="0.55"/>
    <circle cx="41" cy="15" r="3.8" fill="#22d3ee" opacity="0.55"/>

    <!-- Resolution hub: faint ring + solid core, where both signals land -->
    <circle cx="28" cy="40" r="9.5" fill="none" stroke="#22d3ee" stroke-width="1.4" opacity="0.3"/>
    <circle cx="28" cy="40" r="6.2" fill="#22d3ee"/>
</svg>
